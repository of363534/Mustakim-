<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db=JSON.parse(localStorage.getItem('msg_db')||'null')||{me:null,contacts:{},msgs:{},calls:[],unread:{}};
const save=()=>localStorage.setItem('msg_db',JSON.stringify(db));
const ICE={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'},
 {urls:['turn:openrelay.metered.ca:80','turn:openrelay.metered.ca:443','turn:openrelay.metered.ca:443?transport=tcp'],username:'openrelayproject',credential:'openrelayproject'}]};
let peer,conns={},cur=null,call=null,stream=null,ringT=null,ringA=null,tm=null;
const COL=['#0f766e','#7c3aed','#db2777','#ea580c','#2563eb','#65a30d','#b45309'];
const av=(n,id)=>`<div class="av" style="background:${COL[[...id].reduce((a,c)=>a+c.charCodeAt(0),0)%COL.length]}">${esc((n||'?').trim().charAt(0))}</div>`;
const tfmt=t=>new Date(t).toLocaleTimeString('bn-BD',{hour:'2-digit',minute:'2-digit'});
const dfmt=t=>{const d=new Date(t),n=new Date();return d.toDateString()===n.toDateString()?tfmt(t):d.toLocaleDateString('bn-BD',{day:'numeric',month:'short'})};
const dur=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const nameOf=id=>(db.contacts[id]||{}).name||id;
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(()=>t.style.display='none',2600)}

/* setup */
function setup(){keepAlive();const n=$('#sn').value.trim();if(!n)return toast('নাম লিখুন');
 db.me={name:n,id:'msg'+Math.random().toString(36).slice(2,10)};save();boot()}
function boot(){$('#setup').classList.remove('on');$('#myid').textContent=db.me.id;renderChats();renderCalls();start()}

/* network */
function start(){
 peer=new Peer(db.me.id,{config:ICE});
 peer.on('open',()=>{$('#dot').classList.add('on');Object.keys(db.contacts).forEach(connect)});
 peer.on('disconnected',()=>{$('#dot').classList.remove('on');setTimeout(()=>{try{peer.reconnect()}catch(e){}},2000)});
 peer.on('error',e=>{if(e.type==='unavailable-id'){setTimeout(()=>{peer.destroy();start()},3000)}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){$('#dot').classList.remove('on')}});
 peer.on('connection',wire);
 peer.on('call',incoming);
}
function wire(c){const id=c.peer;
 c.on('open',()=>{conns[id]=c;c.send({t:'hi',name:db.me.name});flush(id)});
 c.on('data',d=>recv(id,d));
 c.on('close',()=>{if(conns[id]===c)delete conns[id]});
 c.on('error',()=>{});}
function connect(id){if(!peer||!peer.open||(conns[id]&&conns[id].open))return;wire(peer.connect(id,{reliable:true}))}
function recv(id,d){
 if(d.t==='hi'){if(!db.contacts[id])db.contacts[id]={name:d.name||id};save();renderChats()}
 if(d.t==='m'){if(!db.contacts[id])db.contacts[id]={name:id};
  (db.msgs[id]=db.msgs[id]||[]).push({d:'in',x:String(d.x).slice(0,4000),t:Date.now()});
  if(cur!==id)db.unread[id]=(db.unread[id]||0)+1;notify(nameOf(id),String(d.x).slice(0,120),'m'+id);save();renderChats();if(cur===id)renderMsgs()}}
function flush(id){const c=conns[id];if(!c||!c.open){connect(id);return}
 (db.msgs[id]||[]).forEach(m=>{if(m.d==='out'&&!m.s){c.send({t:'m',x:m.x});m.s=1}});save();if(cur===id)renderMsgs();renderChats()}

/* contacts & chat */
function openSheet(){$('#sheet').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on')}
function shareId(){const t=db.me.id;if(navigator.share)navigator.share({title:'মেসেজ',text:'মেসেজ অ্যাপে আমার আইডি: '+t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>toast('আইডি কপি হয়েছে'));else toast(t)}
function addC(){const id=$('#fid').value.trim().toLowerCase(),n=$('#fnm').value.trim();
 if(!id||!n)return toast('আইডি ও নাম দুটোই দিন');if(id===db.me.id)return toast('এটা আপনার নিজের আইডি');
 db.contacts[id]={name:n};save();$('#fid').value=$('#fnm').value='';closeSheet();connect(id);renderChats();openChat(id)}
function openChat(id){cur=id;db.unread[id]=0;save();$('#cnm').textContent=nameOf(id);$('#cav').innerHTML=av(nameOf(id),id);
 $('#chat').classList.add('on');renderMsgs();renderChats();connect(id);flush(id)}
function closeChat(){cur=null;$('#chat').classList.remove('on');renderChats()}
function delChat(){if(!confirm('এই চ্যাট ও বন্ধু মুছে ফেলবেন?'))return;delete db.contacts[cur];delete db.msgs[cur];delete db.unread[cur];save();closeChat()}
function send(){const i=$('#txt'),x=i.value.trim();if(!x||!cur)return;i.value='';
 (db.msgs[cur]=db.msgs[cur]||[]).push({d:'out',x,t:Date.now(),s:0});save();flush(cur);renderMsgs();renderChats();i.focus()}
$('#txt').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function renderMsgs(){const b=$('#msgs');const l=db.msgs[cur]||[];
 b.innerHTML=l.length?l.map(m=>`<div class="b ${m.d==='out'?'o':''}">${esc(m.x)}<small>${tfmt(m.t)}${m.d==='out'?(m.s?' ✓':' ⏳'):''}</small></div>`).join(''):'<div class="empty">এখনো কোনো মেসেজ নেই।<br>প্রথম মেসেজ পাঠান।</div>';
 b.scrollTop=b.scrollHeight}
function renderChats(){const ids=Object.keys(db.contacts);
 ids.sort((a,b)=>((db.msgs[b]||[]).slice(-1)[0]||{t:0}).t-((db.msgs[a]||[]).slice(-1)[0]||{t:0}).t);
 $('#v-chats').innerHTML=ids.length?ids.map(id=>{const l=db.msgs[id]||[],m=l[l.length-1],u=db.unread[id]||0;
  return `<div class="row" onclick="openChat('${id}')">${av(nameOf(id),id)}<div class="mid"><div class="nm">${esc(nameOf(id))}</div><div class="sub">${m?esc(m.x):'মেসেজ পাঠান'}</div></div><div class="meta">${m?dfmt(m.t):''}${u?`<br><span class="badge">${u}</span>`:''}</div></div>`}).join(''):
  '<div class="empty">কোনো বন্ধু নেই।<br>নিচের + চাপুন, বন্ধুর আইডি দিন।<br>নিজের আইডি “আমার আইডি” থেকে পাঠান।</div>'}
function renderCalls(){$('#v-calls').innerHTML=db.calls.length?db.calls.map(c=>{const miss=c.d==='in'&&!c.dur;
  const st=(miss?'মিসড':c.d==='in'?'ইনকামিং':'আউটগোয়িং')+(c.dur?' · '+dur(c.dur):(!miss?' · উত্তর নেই':''));
  return `<div class="row">${av(nameOf(c.id),c.id)}<div class="mid"><div class="nm ${miss?'miss':''}">${esc(nameOf(c.id))}</div><div class="sub">${c.v?'🎥':'📞'} ${st}</div></div><div class="meta">${dfmt(c.t)}</div><button class="ib" style="background:var(--g);width:38px;height:38px" onclick="dial('${c.id}',${c.v})">${c.v?'🎥':'📞'}</button></div>`}).join(''):
  '<div class="empty">কোনো কল নেই।<br>চ্যাট খুলে 📞 বা 🎥 চাপুন।</div>'}
function tab(t){['chats','calls'].forEach(x=>{$('#v-'+x).classList.toggle('on',x===t);$('#n-'+x).classList.toggle('on',x===t)});$('#fab').style.display=t==='chats'?'block':'none'}

/* calls */
function ringStart(){ringStop();try{ringA=new(window.AudioContext||window.webkitAudioContext)();const b=()=>{const o=ringA.createOscillator(),g=ringA.createGain();o.frequency.value=480;g.gain.value=.15;o.connect(g);g.connect(ringA.destination);o.start();o.stop(ringA.currentTime+.5)};b();ringT=setInterval(()=>{b();navigator.vibrate&&navigator.vibrate(400)},1600)}catch(e){}}
function ringStop(){clearInterval(ringT);ringT=null;if(ringA){try{ringA.close()}catch(e){}ringA=null}}
function showCall(id,video,st){$('#kav').outerHTML=av(nameOf(id),id).replace('class="av"','class="av" id="kav"');$('#knm').textContent=nameOf(id);$('#kst').textContent=st;
 $('#lv').style.display=video?'block':'none';$('#rv').style.display=video?'block':'none';$('#bc').style.display=video?'':'none';
 $('#bm').className='';$('#bc').className='';$('#call').classList.add('on')}
async function media(video){try{return await navigator.mediaDevices.getUserMedia({audio:true,video:video?{facingMode:'user'}:false})}catch(e){toast('মাইক/ক্যামেরার অনুমতি দিন (HTTPS লিংকে খুলুন)');return null}}
async function dial(id,video){if(call)return;if(!peer||!peer.open)return toast('ইন্টারনেট সংযোগ নেই, একটু পরে চেষ্টা করুন');
 stream=await media(video);if(!stream)return;
 const c=peer.call(id,stream,{metadata:{video,name:db.me.name}});c._video=video;c._in=false;c._t0=Date.now();call=c;
 showCall(id,video,'কল হচ্ছে…');$('#lv').srcObject=stream;wireCall(c);
 setTimeout(()=>{if(call===c&&!c._start){toast('উত্তর দেননি');finish(c)}},45000)}
function wireCall(c){
 c.on('stream',rs=>{if(c._start)return;c._start=Date.now();$('#rv').srcObject=rs;$('#kst').textContent='00:00';
  tm=setInterval(()=>{$('#kst').textContent=dur(Math.round((Date.now()-c._start)/1000))},1000)});
 c.on('close',()=>finish(c));c.on('error',()=>finish(c))}
function incoming(c){const id=c.peer,m=c.metadata||{};
 if(!db.contacts[id]){db.contacts[id]={name:m.name||id};save();renderChats()}
 c._video=!!m.video;c._in=true;c._t0=Date.now();
 if(call){c.close();db.calls.unshift({id,v:c._video,d:'in',t:c._t0,dur:0});save();renderCalls();return}
 notify('📞 '+nameOf(id),c._video?'ভিডিও কল আসছে':'ভয়েস কল আসছে','call');call=c;$('#iav').outerHTML=av(nameOf(id),id).replace('class="av"','class="av" id="iav"');$('#inm').textContent=nameOf(id);
 $('#ist').textContent=c._video?'ভিডিও কল আসছে…':'ভয়েস কল আসছে…';$('#inc').classList.add('on');ringStart();
 c.on('close',()=>finish(c))}
async function accept(){const c=call;if(!c)return;ringStop();$('#inc').classList.remove('on');
 stream=await media(c._video);if(!stream){finish(c);return}
 showCall(c.peer,c._video,'সংযুক্ত হচ্ছে…');$('#lv').srcObject=stream;c.answer(stream);wireCall(c)}
function reject(){if(call)finish(call)}
function tgl(k){if(!stream)return;const t=k==='a'?stream.getAudioTracks()[0]:stream.getVideoTracks()[0];if(!t)return;t.enabled=!t.enabled;$(k==='a'?'#bm':'#bc').className=t.enabled?'':'off'}
function finish(c){if(!c||c._done)return;c._done=true;if(call===c)call=null;ringStop();clearInterval(tm);
 if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
 try{c.close()}catch(e){}
 $('#rv').srcObject=null;$('#lv').srcObject=null;$('#call').classList.remove('on');$('#inc').classList.remove('on');
 db.calls.unshift({id:c.peer,v:c._video,d:c._in?'in':'out',t:c._t0,dur:c._start?Math.round((Date.now()-c._start)/1000):0});
 db.calls=db.calls.slice(0,200);save();renderCalls()}


/* background: notification + keep-alive */
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function notify(title,body,tag){
 if(!('Notification' in window)||Notification.permission!=='granted'||!document.hidden)return;
 try{const r=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();
  if(r)r.showNotification(title,{body,tag,renotify:true,vibrate:[300,150,300,150,300],requireInteraction:tag==='call'});
  else new Notification(title,{body,tag})}catch(e){}}
function keepAlive(){const a=$('#ka');a.volume=.01;a.play().catch(()=>{});
 if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
 if(navigator.wakeLock&&!document.hidden)navigator.wakeLock.request('screen').catch(()=>{})}
document.addEventListener('click',keepAlive,{once:true});
if(db.me)boot();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&peer&&peer.open){Object.keys(db.contacts).forEach(id=>{flush(id)})}});
addEventListener('online',()=>{if(peer&&peer.disconnected)try{peer.reconnect()}catch(e){}});
</script>
  <script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .catch(err => console.error('Service Worker:', err));
  });
}
  </script>
</body>
</html>
